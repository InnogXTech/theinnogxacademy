
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InnogX Academy</title>
    
    <script>
        // Minimal shim for process.env to satisfy library requirements without conflicting with Vite
        window.process = window.process || { env: { NODE_ENV: 'production', API_KEY: '' } };
        window.global = window;
    </script>

    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,300,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            screens: {
                'xs': '475px',
                'sm': '640px',
                'md': '768px',
                'lg': '1024px',
                'xl': '1280px',
                '2xl': '1536px',
            },
            extend: {
              fontFamily: { sans: ['Satoshi', 'sans-serif'] },
            },
          },
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Satoshi', sans-serif; margin: 0; padding: 0; background: #0f172a; overflow-x: hidden; }
        .bg-purple-gradient { background: linear-gradient(135deg, #e51bea 0%, #8a03aa 100%); }
        .text-purple-gradient { background: linear-gradient(135deg, #e51bea 0%, #8a03aa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        @keyframes gridMove {
          0% { background-position: 0 0; }
          100% { background-position: 100px 100px; }
        }

        @keyframes gridPulse {
          0%, 100% { opacity: 0.6; }
          50% { opacity: 1; }
        }

        .bg-grid-pattern {
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            background-image:
                linear-gradient(to right, rgba(229, 27, 234, 0.35) 1.5px, transparent 1.5px),
                linear-gradient(to bottom, rgba(138, 3, 170, 0.35) 1.5px, transparent 1.5px),
                linear-gradient(to right, rgba(229, 27, 234, 0.1) 0.5px, transparent 0.5px),
                linear-gradient(to bottom, rgba(138, 3, 170, 0.1) 0.5px, transparent 0.5px);
            animation: gridMove 15s linear infinite;
        }

        .grid-glow-overlay {
            background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(15, 23, 42, 0.8) 80%);
            pointer-events: none;
        }
        
        @media (max-width: 640px) {
            .bg-grid-pattern { background-size: 60px 60px, 60px 60px, 12px 12px, 12px 12px; }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #8a03aa; border-radius: 10px; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes slideIn {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }
        .animate-slide-in { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@6.26.2?external=react,react-dom",
    "lucide-react": "https://esm.sh/lucide-react@0.474.0?external=react,react-dom",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "bytez.js": "https://esm.sh/bytez.js@0.0.1"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 font-sans">
    <div id="root">
        <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: white; flex-direction: column; gap: 20px;">
            <div style="width: 32px; height: 32px; border: 3px solid #8a03aa; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <p style="font-family: sans-serif; font-size: 9px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5;">Synchronizing Nodes...</p>
        </div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
